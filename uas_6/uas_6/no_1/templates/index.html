<!DOCTYPE html>
<html>
<head>
    <title>Index</title>
</head>
<body>

<h2>Halaman Index</h2>
<p>Login sebagai: <b>{{ user }}</b></p>

<form method="post">
    <label>Nama</label><br>
    <input type="text" name="nama" required><br><br>

    <label>NIM</label><br>
    <input type="text" name="nim" required><br><br>

    <label>Nilai (pisahkan dengan koma)</label><br>
    <input type="text" name="nilai" placeholder="80,75,90,60" required><br><br>

    <button type="submit">Simpan</button>
</form>

<hr>

{% if nama %}
<h3>Hasil</h3>
<p>Nama : {{ nama }}</p>
<p>NIM  : {{ nim }}</p>
<p>Nilai: {{ nilai }}</p>
<p>Nilai Maks : {{ maks }}</p>
<p>Nilai Min  : {{ mini }}</p>
{% endif %}

<a href="/logout">Logout</a>

</body>
</html>
